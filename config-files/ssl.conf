Listen 443 https

<VirtualHost _default_:443>

    # Your Domain Name change it 
    ServerName your-domain.com:443

    # Website Root Directory change it 
    DocumentRoot "/var/www/html"

    # Enable SSL
    SSLEngine on

    # SSL Certificate File
    # PUT YOUR SSL CERTIFICATE FILE HERE
    SSLCertificateFile /etc/pki/tls/certs/your_certificate.crt

    # SSL Private Key File
    # PUT YOUR PRIVATE KEY FILE HERE
    SSLCertificateKeyFile /etc/pki/tls/private/your_private.key

    # Directory Permissions
    <Directory "/var/www/html">
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog logs/ssl_error_log

    TransferLog logs/ssl_access_log

</VirtualHost>